services:
  provider-directory:
    build: .
    container_name: provider_directory
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      AUTH_DISABLED: "1"
      DATABASE_URL: postgresql://healthcare:healthcare_dev@postgres:5432/providers
      KAFKA_BOOTSTRAP: kafka:9092
      SERVICE_HOST_MODE: docker
      PORT_PROVIDERS_SERVICE: "8200"
      PORT_SPECIALTIES_SERVICE: "8203"
      PORT_CREDENTIALING_SERVICE: "8201"
      PORT_AUDIT_LOG_SERVICE: "8007"
      LOG_LEVEL: INFO
    ports:
      - "8206:8206"
    networks:
      - healthcare_net
    volumes:
      - ../../libs/py-healthcare-common:/opt/py-healthcare-common:ro
    command: >
      sh -c "cp -r /opt/py-healthcare-common /tmp/lib && pip install --quiet /tmp/lib && python -m app.main"
